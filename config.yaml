# CFB Blend configuration. Every tunable constant lives here.

# "auto" = the season in progress: August-January belongs to that fall's season
# (January 2027 -> 2026). Or set a year to pin it.
season: auto
# The weekly job takes a break in these months (after the title game, before
# the next preseason poll) and starts again on its own in August.
offseason_months: [2, 3, 4, 5, 6, 7]

api:
  base_url: https://api.collegefootballdata.com
  key_env: CFBD_API_KEY        # the key is read from this env var, never stored in the repo
  timeout_seconds: 30
  max_retries: 3

paths:
  raw: data/raw                # data/raw/<season>/week_<n>/
  processed: data/processed    # data/processed/<season>/week_<n>.json
  aliases: config/team_aliases.yaml

fetch:
  # A week is "complete" (its games are never re-downloaded) once every FBS game
  # in it is final. If a game never gets a result (cancelled), we stop waiting
  # this many days after the week ends. Polls are NOT part of this: they are
  # re-downloaded every run because their release day varies (AP Sunday, CFP
  # Tuesday, either can be late).
  games_grace_days: 2

# Fresher SP+, FPI and polls straight from ESPN (see src/espn.py). Unofficial
# sources: if any of them fails or looks wrong, that input falls back to CFBD.
espn:
  enabled: true
  user_agent: "cfb-blend (personal project; github.com/kysonallstar-stack/CFP-FPI-SP--APpoll-Rank-mix)"
  timeout_seconds: 30
  rankings_url: https://site.api.espn.com/apis/site/v2/sports/football/college-football/rankings
  fpi_url: https://site.web.api.espn.com/apis/fitt/v3/sports/football/college-football/powerindex?region=us&lang=en&limit=200
  # Bill Connelly's SP+ article, updated in place every Sunday morning. It gets
  # a new address each season: add next year's here (until then CFBD's SP+ is used).
  sp_article:
    2026: https://www.espn.com/college-football/story/_/id/49868647/2026-college-football-sp+-rankings-all-138-fbs-teams
  # Names in that article that mean something else in CFBD's alias list.
  sp_name_overrides:
    KSU: Kennesaw State        # CFBD lists "KSU" as Kansas State

polls:
  ap: AP Top 25
  cfp: Playoff Committee Rankings

rating:
  # The "computers": each is z-scored across FBS teams, then they're averaged.
  #   sp, fpi  ESPN's ratings, via CFBD. CFBD can lag ESPN by a week or more.
  #   elo      CFBD's Elo, updated after every game.
  #   srs      our own margin rating, refitted from all games played so far.
  # Elo and srs guarantee the rating reacts to last weekend even when SP+/FPI
  # haven't been refreshed at the source. A source with no data is skipped.
  metric_sources: [sp, fpi, elo, srs]
  # Relative weights (default 1). ESPN's ratings are the stronger systems when
  # fresh, so they get two-thirds of the computer side; Elo and srs share a third.
  # On week-5 games (week-4 ratings): avg miss 11.7 with SP+/FPI alone, 12.0 at
  # 0.5 each, 12.3 at equal weights -- but SP+/FPI alone barely moved week to week.
  metric_weights: {sp: 1.0, fpi: 1.0, elo: 0.5, srs: 0.5}
  metric_fallback: [elo]       # used only if none of the above has data
  srs_lambda: 1.5              # ridge prior = sigma^2 / sd(ratings)^2 = 16^2 / 13.3^2
  srs_margin_cap: 28           # cap each game's margin so blowouts don't dominate
  srs_min_week: 4              # don't use srs until teams have played ~4 games
  # Converts the blended z back to points. Normally SP+'s own SD that week;
  # this is used only when SP+ is missing (e.g. the 2025 backtest).
  # 13.3 = SD of 2026 week-4 SP+ across FBS.
  fallback_points_sd: 13.3

poll:
  # zscore  = as specified: z-score AP points across all FBS teams (unranked = floor)
  # matched = map points onto the metrics scale using the ranked teams; unranked
  #           teams' poll value = min(own metrics value, floor)
  method: matched
  # Unranked teams' points: the lowest vote-getter minus the average gap between
  # adjacent ranked teams ("one more rank-step below #25").

weight:                        # w = poll weight; blend = (1 - w) * metrics + w * poll
  start_week: 5
  start: 0.25                  # w at week 5 or earlier
  end_week: 12
  end: 0.40                    # w at week 12 or later

cfp:
  replace_ap: true             # once committee rankings exist, they replace the AP poll
  weight: 0.50                 # poll weight while CFP rankings are in use

sim:
  n_sims: 10000
  seed: 42                     # fixed for reproducible runs; set to null for fresh randomness
  # Home-field advantage, points. 2025 conference games (every team ~half at home,
  # so strength cancels): mean home margin 2.71 (90% CI 1.4-4.1), n=537.
  hfa: 2.7
  # SD of actual margin around predicted margin. 2025 Elo-based predictions had a
  # residual SD of 16.1 (15.4 from week 8 on). Phase 4 re-measures this for our blend.
  sigma: 16.0
  # Multiplies predicted margins. Backtest slope was 0.73-0.81 (predictions too
  # extreme) on the Elo+SRS stand-in; 0.9 hedges toward trusting SP+'s own scale.
  margin_scale: 0.9
  fcs_rating_default: -20.0    # used only if <10 completed FBS-vs-FCS games to estimate from
  leverage_min_side_sims: 50   # skip games where either outcome occurs in fewer sims (too noisy)
  leverage_z_min: 3.0          # a team's swing counts only if > 3 standard errors (filters sampling noise)
  top_n_games: 10              # length of the leverage and top-matchup lists
  # Conference -> week of a "flex" week whose games are scheduled late (2026: the
  # rebuilt Pac-12's final week, non-conference games). Until real games appear,
  # each team gets a neutral-site placeholder vs. a Group of 6-median opponent.
  flex_weeks:
    2026: {Pac-12: 13}
  # How far a team's rating still moves between week n and the end of the regular
  # season (SD across FBS teams, points). Measured in the backtest as the average
  # of 2024 and 2025 (Elo + margin-rating stand-in for SP+/FPI). Each simulated
  # season draws a hidden offset per team from N(0, this), so a team's results are
  # correlated across its remaining games. Set to null to turn off.
  rating_uncertainty:
    by_week: {1: 9.8, 2: 8.3, 3: 7.2, 4: 6.7, 5: 5.8, 6: 5.3, 7: 4.8, 8: 4.4,
              9: 4.2, 10: 3.6, 11: 3.2, 12: 2.4, 13: 1.8, 14: 0.8, 15: 0.3}

committee:                     # APPROXIMATION of the selection committee, not the real thing
  loss_penalty: 8.5            # points per loss; fitted to 2024-25 final CFP rankings (Phase 4)
  champ_bonus: 0.5             # points for a conference title; fit says ~0 beyond the loss avoided
  noise_sd: 1.5                # per-sim noise: the committee is not perfectly predictable

playoff:                       # verified 2026-27 format (see Phase 0 notes)
  field_size: 12
  byes: 4
  power4: [SEC, Big Ten, Big 12, ACC]
  group6: [American Athletic, Conference USA, Mid-American, Mountain West, Pac-12, Sun Belt]
  g6_bid: highest_ranked       # highest_ranked (2026 rule) | champion (pre-2026 rule)
  notre_dame_id: 87            # auto-bid if ranked in the committee's top 12
  no_title_game: [FBS Independents]
  divisions:                   # title game = division winners instead of top two
    Sun Belt: [East, West]
  # Title game hosted by the higher seed (verified for MW and Pac-12; historical
  # practice for the others). All other title games are at neutral sites.
  title_game_home_of_higher_seed: [Mountain West, Pac-12, American Athletic, Conference USA, Sun Belt]

backtest:
  # SP+/FPI have no weekly history, so past seasons use Elo + our own margin rating.
  metric_sources: [elo, srs]
  calibration_weeks: [4, 7, 10, 13]
  playoff_rules:               # the format that was actually in effect those seasons
    2024: {g6_bid: top5_champions, notre_dame_rule: false}
    2025: {g6_bid: top5_champions, notre_dame_rule: false}
