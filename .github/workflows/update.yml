# Weekly update: fetch new data, rebuild ratings + odds, commit, deploy to GitHub Pages.
name: Weekly update

on:
  schedule:
    # Sunday 13:00 Mountain time: an hour after the AP poll (Sundays at 2 p.m.
    # Eastern = noon Mountain). The timezone key handles daylight saving. GitHub
    # may start scheduled runs late when busy. In the offseason (Feb-Jul) the
    # pipeline exits right away, so these runs do nothing until August.
    - cron: "0 13 * * 0"
      timezone: "America/Denver"
    # Wednesday 10:00: picks up CFP rankings (released Tuesday nights in Nov/Dec)
    # and any poll that came out late. Sends no notification if nothing changed.
    - cron: "0 10 * * 3"
      timezone: "America/Denver"
  workflow_dispatch:        # "Run workflow" button on the Actions tab
  push:                     # redeploy (without refetching) when the page code changes
    branches: [main]
    paths: ["site/**", ".github/workflows/update.yml"]

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write       # to commit the refreshed data
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q
      - name: Run pipeline
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}   # stored as a repo secret, never in the code
        run: python -m src.pipeline
      - name: Commit updated data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data site
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Weekly data update $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: update
    # Run after a successful update, or on its own for page-code pushes.
    if: always() && (needs.update.result == 'success' || needs.update.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main           # pick up the data commit the update job just pushed
          fetch-depth: 2      # the notifier compares with the previous commit
      - name: Stamp build number (cache busting)
        # Browsers keep files ~10 minutes (longer on phones). A new number in the
        # asset URLs forces fresh files, and build.txt lets an old cached page
        # notice it's out of date and reload itself.
        run: |
          B="r${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          sed -i "s/__BUILD__/$B/g" site/index.html
          printf '%s' "$B" > site/build.txt
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
      - name: Phone notification
        if: needs.update.outputs.changed == 'true'
        continue-on-error: true   # a failed notification shouldn't mark the update as failed
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 -m src.notify --prev-ref HEAD~1
