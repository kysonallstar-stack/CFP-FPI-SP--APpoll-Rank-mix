# Weekly update: fetch new data, rebuild ratings + odds, commit, deploy to GitHub Pages.
name: Weekly update

on:
  schedule:
    # Monday 10:00 Mountain time, after the Sunday AP poll. The timezone key
    # handles daylight saving. GitHub may start scheduled runs late when busy.
    - cron: "0 10 * * 1"
      timezone: "America/Denver"
  workflow_dispatch:        # "Run workflow" button on the Actions tab
  push:                     # redeploy (without refetching) when the page code changes
    branches: [main]
    paths: ["site/**", ".github/workflows/update.yml"]

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write       # to commit the refreshed data
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q
      - name: Run pipeline
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}   # stored as a repo secret, never in the code
        run: python -m src.pipeline
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data site
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Weekly data update $(date -u +%Y-%m-%d)"
            git push
          fi

  deploy:
    needs: update
    # Run after a successful update, or on its own for page-code pushes.
    if: always() && (needs.update.result == 'success' || needs.update.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main           # pick up the data commit the update job just pushed
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
